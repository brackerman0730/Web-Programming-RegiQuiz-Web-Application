<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Change Password - RegiQuiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home Page</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="mysets.html">My Sets</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="createset.html">Create Set</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" id="navProfileLink" href="#">Profile</a>
                </li>
              </ul>
            </div>

          </nav>
    <!-- Change Password Section -->
     <div class="container mt-5">
        <div class="row justify-content-center">
           <div class="col-12 col-md-6">
              <div class="card p-4 shadow">
                <h2 class="text-center mb-4">
                  Change Password
                </h2>

                <div id="passwordError" class="alert alert-danger d-none" role="alert"></div>
                <div id="passwordSuccess" class="alert alert-success d-none" role="alert">
                    Password changed successfully.
                </div>

                <form id="changePasswordForm">
                  <div class="mb-3">
                      <label class="form-label">
                        Current Password
                      </label>
                      <input type="password" id="currentPassword" class="form-control" required>
                  </div>

                  <div class="mb-3">
                      <label class="form-label">
                        New Password
                      </label>
                      <input type="password" id="newPassword" class="form-control" required>
                  </div>

                  <div class="mb-3">
                      <label class="form-label">
                        Confirm New Password
                      </label>
                      <input type="password" id="confirmPassword" class="form-control" required>
                  </div>

                  <div class="d-grid">
                      <button type="submit" class="btn btn-primary btn-lg">
                          Change Password
                      </button>
                  </div>
                </form>

                <p class="text-center mt-3">
                  <a href="profile.html">Back to Profile</a>
                </p>
              </div>
            </div>

        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script>
  async function requireLogin() {
      let data = await checkAuth();
      if (!data.loggedIn) {
          window.location.href = "login.html";
      }
  }

  requireLogin();

  document.getElementById("changePasswordForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      let errorAlert = document.getElementById("passwordError");
      let successAlert = document.getElementById("passwordSuccess");
      errorAlert.classList.add("d-none");
      successAlert.classList.add("d-none");

      let currentPassword = document.getElementById("currentPassword").value;
      let newPassword = document.getElementById("newPassword").value;
      let confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
          errorAlert.textContent = "New passwords don't match.";
          errorAlert.classList.remove("d-none");
          return;
      }

      let response = await fetch('/change-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ currentPassword, newPassword })
      });
      let data = await response.json();

      if (data.success) {
          successAlert.classList.remove("d-none");
          document.getElementById("changePasswordForm").reset();
      } else {
          errorAlert.textContent = data.message;
          errorAlert.classList.remove("d-none");
      }
  });
</script>
</body>
</html>
