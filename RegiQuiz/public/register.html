<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <script src="js/theme-init.js"></script>
    <title>Make an Account - RegiQuiz</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
        <div class="container-fluid">
          <!-- Links -->
              <ul class="navbar-nav">
                <li class="nav-item">
                  <a class="nav-link" href="index.html">Home Page</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="mysets.html">My Sets</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" href="createset.html">Create Set</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link" id="navProfileLink" href="#">Profile</a>
                </li>
              </ul>
            </div>

          </nav>
    <!-- Form Section -->
     <div class="container mt-5">
        <div class="row justify-content-center">
           <div class="col-12 col-md-6">
              <div class="card p-4 shadow">
                <h2 class="text-center mb-4">
                  Make an Account
                </h2>

                <div id="takenAlert" class="alert alert-danger d-none" role="alert">
                    That username is already taken.
                </div>
                <div id="missingAlert" class="alert alert-danger d-none" role="alert">
                    Please fill out both fields.
                </div>

                <form action="/register" method="post">

                  <!-- Username -->
                  <div class="mb-3">
                      <label class="form-label">
                        Username
                      </label>
                      <input type="text" name="txt_username" class="form-control" required>
                  </div>

                  <!-- Password -->
                  <div class="mb-3">
                      <label class="form-label">
                        Password
                      </label>
                      <input type="password" name="txt_password" class="form-control" required>
                  </div>

                  <!-- Submit -->
                  <div class="d-grid">
                      <button type="submit" class="btn btn-primary btn-lg">
                          Make an Account
                      </button>
                  </div>

                  <p class="text-center mt-3">
                    Already have an account? <a href="login.html">Log in</a>
                  </p>

              </form>
              </div>
            </div>

        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script>
  let params = new URLSearchParams(window.location.search);
  if (params.get("error") === "taken") {
      document.getElementById("takenAlert").classList.remove("d-none");
  }
  if (params.get("error") === "missing") {
      document.getElementById("missingAlert").classList.remove("d-none");
  }
</script>
</body>
</html>
